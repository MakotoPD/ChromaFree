name: Feature request
description: Suggest an idea or an improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. ChromaFree aims to stay light on resources, so please mention how the feature would be used.
        You can also discuss ideas first on the [Discord server](https://discord.gg/pv52eNr6uc).
  - type: checkboxes
    id: checks
    attributes:
      label: Before you suggest
      options:
        - label: I searched the existing issues and this idea has not been suggested yet.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what makes it hard today?
      placeholder: When I stream with Meld Studio I want to...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or workarounds you tried.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Background effects
        - Masking and segmentation models
        - Virtual camera and app compatibility
        - Settings window or tray
        - Performance
        - Installer
        - Translations
        - Other
    validations:
      required: true
  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to help implement it?
      options:
        - "No"
        - Yes, I can open a pull request
        - I can help with testing

[workspace]
resolver = "3"
members = ["crates/bgcam-core", "crates/bgcam-gpu", "crates/bgcam-ipc", "tools/bgcam-probe"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
bgcam-core = { path = "crates/bgcam-core" }
bgcam-ipc = { path = "crates/bgcam-ipc" }
anyhow = "1"
thiserror = "2"
half = "2"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native", "api-27", "directml", "half", "preload-dylibs"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
windows = { version = "0.62", features = [
    "Win32_AI_MachineLearning_DirectML",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
debug = "line-tables-only"

[profile.bench]
debug = "line-tables-only"
